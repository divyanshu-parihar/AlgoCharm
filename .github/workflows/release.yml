name: Release CLI

on:
  push:
    branches: [master]
    paths:
      - 'cli/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public distribution repo (user needs to create this)
  DIST_REPO: divyanshu-parihar/charm-cli
  
jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd cli
          go build -ldflags="-s -w -X github.com/divyanshu-parihar/AlgoCharm/cli/internal/ui.Version=${{ github.sha }}" -o ../dist/charm-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: charm-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/charm-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create checksums
        run: |
          cd dist
          sha256sum charm-* > checksums.txt

      - name: Create Release in Source Repo
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Charm CLI ${{ steps.version.outputs.version }}
          body: |
            ## Charm CLI Release
            
            **Commit:** ${{ github.sha }}
            
            See public distribution repo for easy installation.
          files: |
            dist/charm-*
            dist/checksums.txt
          draft: false
          prerelease: false

  # Sync to public distribution repo
  sync-to-public:
    name: Sync to Public Repo
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create checksums
        run: |
          cd dist
          sha256sum charm-* > checksums.txt

      - name: Prepare install script
        run: cp install.sh dist/

      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Charm CLI ${{ steps.version.outputs.version }}
          body: |
            ## Charm CLI ${{ steps.version.outputs.version }}
            
            ### Quick Install
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ env.DIST_REPO }}/main/install.sh | bash
            ```
            
            ### Manual Install
            
            **macOS (Apple Silicon):**
            ```bash
            curl -L https://github.com/${{ env.DIST_REPO }}/releases/download/${{ steps.version.outputs.version }}/charm-darwin-arm64 -o charm
            chmod +x charm && sudo mv charm /usr/local/bin/
            ```
            
            **macOS (Intel):**
            ```bash
            curl -L https://github.com/${{ env.DIST_REPO }}/releases/download/${{ steps.version.outputs.version }}/charm-darwin-amd64 -o charm
            chmod +x charm && sudo mv charm /usr/local/bin/
            ```
            
            **Linux:**
            ```bash
            curl -L https://github.com/${{ env.DIST_REPO }}/releases/download/${{ steps.version.outputs.version }}/charm-linux-amd64 -o charm
            chmod +x charm && sudo mv charm /usr/local/bin/
            ```
          files: |
            dist/charm-*
            dist/checksums.txt
            dist/install.sh
          draft: false
          prerelease: false
